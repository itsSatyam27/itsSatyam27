<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 232" width="500" height="232" role="img" aria-label="Satyam Pandey's top languages">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes spin{from{stroke-dashoffset:0}to{stroke-dashoffset:-251.3}}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes shineX{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(560px) skewX(-15deg)}}
@keyframes arcDraw{from{stroke-dashoffset:var(--offset-start)}to{stroke-dashoffset:var(--offset-end)}}
.lbl{opacity:0;animation:fadeSlide .4s ease forwards}
.sh{animation:shineX 4.5s ease-in-out 3s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#818cf8;#22d3ee;#818cf8" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cc"><rect x="1" y="1" width="498" height="230" rx="14"/></clipPath>
</defs>

<rect x="1" y="1" width="498" height="230" rx="14" fill="#0B1220" stroke="url(#tg)" stroke-width="1.5"/>
<text x="24" y="38" font-size="15" font-weight="bold" fill="url(#tg)">🧩 Most Used Languages</text>

<!-- Donut chart centred at 136,136, r=72, circumference=452.4 -->
<!-- Track -->
<circle cx="136" cy="136" r="72" fill="none" stroke="#1e2d40" stroke-width="20"/>

<!-- JavaScript 70% = 316.7deg of 452.4 = 316.7 -->
<circle cx="136" cy="136" r="72" fill="none" stroke="#fde047" stroke-width="20"
  stroke-linecap="butt" stroke-dasharray="316.7 452.4" stroke-dashoffset="113.1"
  transform="rotate(-90 136 136)" filter="url(#glow)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".3s" begin=".3s" fill="freeze"/>
  <animate attributeName="stroke-dasharray" from="0 452.4" to="316.7 452.4" dur="1.2s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
</circle>

<!-- Python 10% = 45.24 offset start: -316.7 + 113.1 = need dashoffset = 452.4-316.7+113.1 = 248.8 -->
<circle cx="136" cy="136" r="72" fill="none" stroke="#4ade80" stroke-width="20"
  stroke-linecap="butt" stroke-dasharray="45.2 452.4" stroke-dashoffset="-203.6"
  transform="rotate(-90 136 136)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".3s" begin=".9s" fill="freeze"/>
  <animate attributeName="stroke-dasharray" from="0 452.4" to="45.2 452.4" dur=".8s" begin=".9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
</circle>

<!-- Dart 10% = 45.24 -->
<circle cx="136" cy="136" r="72" fill="none" stroke="#7dd3fc" stroke-width="20"
  stroke-linecap="butt" stroke-dasharray="45.2 452.4" stroke-dashoffset="-248.8"
  transform="rotate(-90 136 136)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".3s" begin="1.4s" fill="freeze"/>
  <animate attributeName="stroke-dasharray" from="0 452.4" to="45.2 452.4" dur=".8s" begin="1.4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
</circle>

<!-- CSS 10% = 45.24 -->
<circle cx="136" cy="136" r="72" fill="none" stroke="#818cf8" stroke-width="20"
  stroke-linecap="butt" stroke-dasharray="45.2 452.4" stroke-dashoffset="-294.0"
  transform="rotate(-90 136 136)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".3s" begin="1.9s" fill="freeze"/>
  <animate attributeName="stroke-dasharray" from="0 452.4" to="45.2 452.4" dur=".8s" begin="1.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
</circle>

<!-- Centre label -->
<text x="136" y="128" text-anchor="middle" font-size="11" fill="#475569">top</text>
<text x="136" y="148" text-anchor="middle" font-size="22" font-weight="bold" fill="#f8fafc">4</text>
<text x="136" y="166" text-anchor="middle" font-size="10" fill="#475569">langs</text>

<!-- Legend -->
<g class="lbl" style="animation-delay:.5s">
  <rect x="240" y="58" width="12" height="12" rx="3" fill="#fde047"/>
  <text x="260" y="69" font-size="13" fill="#c9d1d9">JavaScript</text>
  <text x="470" y="69" text-anchor="end" font-size="13" font-weight="bold" fill="#fde047">70%</text>
</g>
<g class="lbl" style="animation-delay:.9s">
  <rect x="240" y="88" width="12" height="12" rx="3" fill="#4ade80"/>
  <text x="260" y="99" font-size="13" fill="#c9d1d9">Python</text>
  <text x="470" y="99" text-anchor="end" font-size="13" font-weight="bold" fill="#4ade80">10%</text>
</g>
<g class="lbl" style="animation-delay:1.3s">
  <rect x="240" y="118" width="12" height="12" rx="3" fill="#7dd3fc"/>
  <text x="260" y="129" font-size="13" fill="#c9d1d9">Dart</text>
  <text x="470" y="129" text-anchor="end" font-size="13" font-weight="bold" fill="#7dd3fc">10%</text>
</g>
<g class="lbl" style="animation-delay:1.7s">
  <rect x="240" y="148" width="12" height="12" rx="3" fill="#818cf8"/>
  <text x="260" y="159" font-size="13" fill="#c9d1d9">CSS</text>
  <text x="470" y="159" text-anchor="end" font-size="13" font-weight="bold" fill="#818cf8">10%</text>
</g>

<text x="240" y="200" font-size="10" fill="#334155">Based on 10 repos · Aug 2026</text>

<g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="120" height="232" fill="url(#shg)"/></g>
</svg>

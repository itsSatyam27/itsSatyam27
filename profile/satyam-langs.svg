<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 232" width="500" height="232" role="img" aria-label="Satyam Pandey's top languages">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes barGrow{from{width:0}to{}}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes shineX{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(560px) skewX(-15deg)}}
.row{opacity:0;animation:fadeSlide .45s ease forwards}
.sh{animation:shineX 4.5s ease-in-out 2.6s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#818cf8;#22d3ee;#818cf8" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="498" height="230" rx="14"/></clipPath>
</defs>

<rect x="1" y="1" width="498" height="230" rx="14" fill="#0B1220" stroke="url(#tg)" stroke-width="1.5"/>
<text x="24" y="38" font-size="15" font-weight="bold" fill="url(#tg)">🧩 Most Used Languages</text>

<!-- JavaScript -->
<g class="row" style="animation-delay:0.4s">
  <text x="24" y="72" font-size="12" fill="#c9d1d9">JavaScript</text>
  <text x="476" y="72" text-anchor="end" font-size="12" font-weight="bold" fill="#fde047">38%</text>
  <rect x="24" y="78" width="452" height="8" rx="4" fill="#1e2d40"/>
  <rect x="24" y="78" height="8" rx="4" fill="#fde047">
    <animate attributeName="width" from="0" to="172" dur="1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Python -->
<g class="row" style="animation-delay:0.6s">
  <text x="24" y="112" font-size="12" fill="#c9d1d9">Python</text>
  <text x="476" y="112" text-anchor="end" font-size="12" font-weight="bold" fill="#4ade80">22%</text>
  <rect x="24" y="118" width="452" height="8" rx="4" fill="#1e2d40"/>
  <rect x="24" y="118" height="8" rx="4" fill="#4ade80">
    <animate attributeName="width" from="0" to="99" dur="1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- TypeScript -->
<g class="row" style="animation-delay:0.8s">
  <text x="24" y="152" font-size="12" fill="#c9d1d9">TypeScript</text>
  <text x="476" y="152" text-anchor="end" font-size="12" font-weight="bold" fill="#7dd3fc">20%</text>
  <rect x="24" y="158" width="452" height="8" rx="4" fill="#1e2d40"/>
  <rect x="24" y="158" height="8" rx="4" fill="#7dd3fc">
    <animate attributeName="width" from="0" to="90" dur="1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Java -->
<g class="row" style="animation-delay:1.0s">
  <text x="24" y="192" font-size="12" fill="#c9d1d9">Java</text>
  <text x="476" y="192" text-anchor="end" font-size="12" font-weight="bold" fill="#f97316">12%</text>
  <rect x="24" y="198" width="452" height="8" rx="4" fill="#1e2d40"/>
  <rect x="24" y="198" height="8" rx="4" fill="#f97316">
    <animate attributeName="width" from="0" to="54" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- CSS -->
<g class="row" style="animation-delay:1.2s">
  <text x="24" y="220" font-size="10" fill="#64748b">CSS / HTML / Other — 8%</text>
  <rect x="24" y="223" width="452" height="4" rx="2" fill="#1e2d40"/>
  <rect x="24" y="223" height="4" rx="2" fill="#818cf8">
    <animate attributeName="width" from="0" to="36" dur="1s" begin="1.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="120" height="232" fill="url(#shg)"/></g>
</svg>

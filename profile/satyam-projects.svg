<a href="https://github.com/itsSatyam27/novyn-chat" target="_blank">
  <g class="prow" style="animation-delay: 0.2s" transform="translate(24, 52)">
    <rect class="card-bg" x="0" y="0" width="632" height="74" rx="10" fill="#0e172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Icon & Title -->
    <text x="18" y="32" font-size="18">💬</text>
    <text x="48" y="30" font-size="14.5" font-weight="bold" fill="#38bdf8">Novyn</text>
    <text x="48" y="52" font-size="11.5" fill="#94a3b8">Real-time Socket.IO Chat Application</text>
    <!-- Tech Pills -->
    <g transform="translate(320, 18)">
      <rect x="0" y="0" width="52" height="22" rx="6" fill="#0f2b3c" stroke="#0284c7" stroke-width="0.8"/>
      <text x="26" y="15" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#38bdf8">Dart</text>

      <rect x="58" y="0" width="68" height="22" rx="6" fill="#143127" stroke="#16a34a" stroke-width="0.8"/>
      <text x="92" y="15" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4ade80">Node.js</text>

      <rect x="132" y="0" width="76" height="22" rx="6" fill="#2d1b4e" stroke="#9333ea" stroke-width="0.8"/>
      <text x="170" y="15" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c084fc">Socket.IO</text>
    </g>
    <!-- Domain Tag -->
    <g transform="translate(540, 26)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#22d3ee">Real-Time</text>
    </g>
  </g>
</a>


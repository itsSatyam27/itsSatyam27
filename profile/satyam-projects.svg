<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" aria-label="Satyam Pandey's Featured Projects">
<defs>
<style><![CDATA[
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
@keyframes fadeSlide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
@keyframes shineX { 0% { transform: translateX(-200px) skewX(-15deg); } 60%, 100% { transform: translateX(780px) skewX(-15deg); } }
@keyframes cardHover { 0%, 100% { opacity: 0.95; } 50% { opacity: 1; } }

.prow { opacity: 0; animation: fadeSlide 0.45s ease forwards; }
.sh { animation: shineX 5s ease-in-out 3s infinite; }
.card-bg { transition: all 0.3s ease; }
]]></style>

<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#4f46e5;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#4f46e5;#22d3ee;#818cf8;#4f46e5" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>

<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity="0.06"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="2" result="b"/>
  <feMerge>
    <feMergeNode in="b"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<clipPath id="cc"><rect x="1" y="1" width="678" height="558" rx="16"/></clipPath>
</defs>

<!-- Outer Card -->
<rect x="1" y="1" width="678" height="558" rx="16" fill="#0B1220" stroke="url(#tg)" stroke-width="1.5"/>

<!-- Header -->
<g transform="translate(24, 32)">
  <text x="0" y="0" font-size="17" font-weight="bold" fill="url(#tg)">🚀 Featured Builds &amp; Projects</text>
</g>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Satyam Pandey — Software Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#090B16"/>
    <stop offset="45%" stop-color="#0f1535"/>
    <stop offset="75%" stop-color="#071428"/>
    <stop offset="100%" stop-color="#060d1a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#60A5FA"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" x2="1">
    <stop stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1b2e"/><stop offset="100%" stop-color="#0a1525"/>
  </linearGradient>
  <linearGradient id="statsBg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0f1f3d"/><stop offset="100%" stop-color="#0b1628"/>
  </linearGradient>
  <radialGradient id="g1" cx="50%" cy="50%"><stop stop-color="#4F46E5" stop-opacity=".4"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="50%" cy="50%"><stop stop-color="#06B6D4" stop-opacity=".3"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.5" fill="#CBD5E1" fill-opacity=".055"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowSm"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .float{animation:float 4s ease-in-out infinite}
    .fadeIn{animation:fadeIn .6s ease forwards}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.65}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</defs>


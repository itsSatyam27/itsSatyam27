<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Satyam Pandey — Software Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B16"/><stop offset=".42" stop-color="#15134A"/><stop offset=".72" stop-color="#063D59"/><stop offset="1" stop-color="#07111F"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#A78BFA"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="g1"><stop stop-color="#4F46E5" stop-opacity=".55"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop stop-color="#06B6D4" stop-opacity=".42"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#CBD5E1" stroke-opacity=".055"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 4.5s ease-in-out infinite}.blink{animation:blink 1.1s steps(2,end) infinite}
    @keyframes pulse{0%,100%{opacity:.28}50%{opacity:.68}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes blink{50%{opacity:0}}
  </style>
</defs>

<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="318" rx="23" fill="url(#grid)" stroke="#334155" stroke-opacity=".8"/>
<circle class="pulse" cx="1000" cy="70" r="280" fill="url(#g2)" filter="url(#blur)"/>
<circle class="pulse" cx="220" cy="300" r="230" fill="url(#g1)" filter="url(#blur)"/>

<path d="M0 278 C170 220 300 300 470 266 S800 208 1200 258" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".45"/>
<path d="M0 288 C200 242 330 308 510 278 S850 230 1200 270" fill="none" stroke="url(#pink)" stroke-width="1" stroke-opacity=".22"/>

<g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
  <text x="72" y="64" font-size="14" fill="#22D3EE">satyam@dev:~$</text>
  <text x="190" y="64" font-size="14" fill="#CBD5E1">whoami</text>
  <text x="254" y="64" font-size="14" fill="#A78BFA">▌</text>
  <circle cx="310" cy="59" r="4" fill="#4ADE80" class="pulse"/>

  <text x="72" y="145" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="900" fill="#F8FAFC">SATYAM</text>
  <text x="337" y="145" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="900" fill="url(#accent)">PANDEY</text>
  <rect x="74" y="164" width="420" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)"/>

  <text x="72" y="205" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#E2E8F0">SOFTWARE DEVELOPER</text>
  <text x="300" y="205" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#64748B">  /  </text>
  <text x="326" y="205" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#67E8F9">FULL-STACK BUILDER</text>
  <text x="72" y="239" font-size="14" fill="#94A3B8">Building real products · learning deeply · shipping consistently</text>

  <g class="float">
    <rect x="830" y="72" width="292" height="164" rx="20" fill="#080F1D" fill-opacity=".78" stroke="#475569" stroke-opacity=".75"/>
    <circle cx="858" cy="99" r="5" fill="#F87171"/><circle cx="876" cy="99" r="5" fill="#FACC15"/><circle cx="894" cy="99" r="5" fill="#4ADE80"/>
    <text x="858" y="129" font-size="11" fill="#64748B">~/current-focus</text>
    <text x="858" y="153" font-size="14" fill="#A5B4FC">01  full-stack</text>
    <text x="858" y="176" font-size="14" fill="#67E8F9">02  backend + systems</text>
    <text x="858" y="199" font-size="14" fill="#C4B5FD">03  DSA + cloud + AI</text>
    <text x="858" y="222" font-size="11" fill="#475569">status: <tspan fill="#4ADE80">building</tspan> <tspan class="blink">_</tspan></text>
  </g>
</g>
</svg>
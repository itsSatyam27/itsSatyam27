<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 232" width="500" height="232" role="img" aria-label="Satyam Pandey's LeetCode stats">
<defs>
<style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rankPulse{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes shineX{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(560px) skewX(-15deg)}}
.row{opacity:0;animation:fadeSlide .45s ease forwards}
.sh{animation:shineX 4.5s ease-in-out 2.8s infinite}
]]></style>

<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#FFA116;#22d3ee;#818cf8;#FFA116" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#FFA116;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>

<linearGradient id="easyGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#00b8a3"/><stop offset="100%" stop-color="#4ade80"/>
</linearGradient>

<linearGradient id="medGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffc01e"/><stop offset="100%" stop-color="#fde047"/>
</linearGradient>

<linearGradient id="hardGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff375f"/><stop offset="100%" stop-color="#f87171"/>
</linearGradient>

<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cc"><rect x="1" y="1" width="498" height="230" rx="14"/></clipPath>
</defs>

<!-- Card Background -->
<rect x="1" y="1" width="498" height="230" rx="14" fill="#0B1220" stroke="url(#tg)" stroke-width="1.5"/>

<!-- Title -->
<g transform="translate(24, 26)">
  <!-- LeetCode mini icon -->
  <path d="M12.5 1.5 L4.5 9.5 L12.5 17.5" fill="none" stroke="#FFA116" stroke-width="2.5" stroke-linecap="round"/>
  <text x="24" y="12" font-size="15" font-weight="bold" fill="url(#tg)">LeetCode Stats · bysatyam</text>
</g>

<!-- Solved Progress Donut Ring (cx=136, cy=136, r=70, circumference=439.8) -->
<circle cx="136" cy="136" r="70" fill="none" stroke="#1e2d40" stroke-width="16"/>

<!-- Easy Arc -->
<circle cx="136" cy="136" r="70" fill="none" stroke="url(#easyGrad)" stroke-width="16"
  stroke-linecap="round" stroke-dasharray="160 439.8" stroke-dashoffset="110"
  transform="rotate(-90 136 136)" filter="url(#glow)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".3s" begin=".3s" fill="freeze"/>
  <animate attributeName="stroke-dasharray" from="0 439.8" to="160 439.8" dur="1.2s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
</circle>

<!-- Center Labels -->
<text x="136" y="122" text-anchor="middle" font-size="10" fill="#64748b" letter-spacing="1">SOLVED</text>
<text x="136" y="148" text-anchor="middle" font-size="26" font-weight="bold" fill="#22d3ee" filter="url(#glow)">1</text>
<text x="136" y="166" text-anchor="middle" font-size="9.5" fill="#64748b">problems</text>

<!-- Right Stats: Easy, Medium, Hard Progress Bars -->

<!-- Row 1: Easy -->
<g class="row" style="animation-delay:0.4s">
  <rect x="240" y="60" width="8" height="8" rx="2" fill="#00b8a3"/>
  <text x="254" y="68" font-size="12" font-weight="bold" fill="#00b8a3">Easy</text>
  <text x="470" y="68" text-anchor="end" font-size="12" font-weight="bold" fill="#e6edf3">1 <tspan fill="#64748b" font-size="10" font-weight="normal">/ 850+</tspan></text>
  <!-- Bar background -->
  <rect x="240" y="76" width="230" height="6" rx="3" fill="#1e2d40"/>
  <!-- Active bar -->
  <rect x="240" y="76" width="35" height="6" rx="3" fill="url(#easyGrad)"/>
</g>

<!-- Row 2: Medium -->
<g class="row" style="animation-delay:0.7s">
  <rect x="240" y="98" width="8" height="8" rx="2" fill="#ffc01e"/>
  <text x="254" y="106" font-size="12" font-weight="bold" fill="#ffc01e">Medium</text>
  <text x="470" y="106" text-anchor="end" font-size="12" font-weight="bold" fill="#e6edf3">0 <tspan fill="#64748b" font-size="10" font-weight="normal">/ 1800+</tspan></text>
  <!-- Bar background -->
  <rect x="240" y="114" width="230" height="6" rx="3" fill="#1e2d40"/>
  <!-- Active bar -->
  <rect x="240" y="114" width="4" height="6" rx="3" fill="url(#medGrad)"/>
</g>

<!-- Row 3: Hard -->
<g class="row" style="animation-delay:1.0s">
  <rect x="240" y="136" width="8" height="8" rx="2" fill="#ff375f"/>
  <text x="254" y="144" font-size="12" font-weight="bold" fill="#ff375f">Hard</text>
  <text x="470" y="144" text-anchor="end" font-size="12" font-weight="bold" fill="#e6edf3">0 <tspan fill="#64748b" font-size="10" font-weight="normal">/ 750+</tspan></text>
  <!-- Bar background -->
  <rect x="240" y="152" width="230" height="6" rx="3" fill="#1e2d40"/>
  <!-- Active bar -->
  <rect x="240" y="152" width="4" height="6" rx="3" fill="url(#hardGrad)"/>
</g>

<!-- Bottom Badge & Status -->
<g class="row" style="animation-delay:1.3s">
  <circle cx="245" cy="186" r="4.5" fill="#4ade80"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="256" y="190" font-size="10.5" fill="#cbd5e1">Active Problem Solver · <tspan fill="#FFA116" font-weight="bold">DSA in progress</tspan></text>
  <text x="470" y="190" text-anchor="end" font-size="9.5" fill="#475569">leetcode.com</text>
</g>

<!-- Shine sweep effect -->
<g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="120" height="232" fill="url(#shg)"/></g>
</svg>

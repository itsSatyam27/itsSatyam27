<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 232" width="500" height="232" role="img" aria-label="Satyam Pandey's GitHub stats">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rankPulse{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes shineX{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(560px) skewX(-15deg)}}
.row{opacity:0;animation:fadeSlide .5s ease forwards}
.rk{animation:rankPulse 2.4s ease-in-out infinite}
.sh{animation:shineX 4.5s ease-in-out 2.4s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#818cf8;#22d3ee;#818cf8" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#4f46e5"/>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="498" height="230" rx="14"/></clipPath>
<filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect x="1" y="1" width="498" height="230" rx="14" fill="#0B1220" stroke="url(#tg)" stroke-width="1.5"/>
<text x="24" y="38" font-size="15" font-weight="bold" fill="url(#tg)">⚡ Satyam Pandey's Stats</text>

<!-- Row 1: Public Repos -->
<g class="row" style="animation-delay:0.40s">
  <text x="24" y="72" font-size="14">📦</text>
  <text x="48" y="72" font-size="13" fill="#c9d1d9">Public Repos:</text>
  <text x="316" y="72" text-anchor="end" font-size="14" font-weight="bold" fill="#4ade80">12</text>
</g>
<!-- Row 2: Projects Shipped -->
<g class="row" style="animation-delay:0.60s">
  <text x="24" y="102" font-size="14">🚀</text>
  <text x="48" y="102" font-size="13" fill="#c9d1d9">Projects Shipped:</text>
  <text x="316" y="102" text-anchor="end" font-size="14" font-weight="bold" fill="#22d3ee">5+</text>
</g>
<!-- Row 3: Languages Used -->
<g class="row" style="animation-delay:0.80s">
  <text x="24" y="132" font-size="14">🧩</text>
  <text x="48" y="132" font-size="13" fill="#c9d1d9">Languages Used:</text>
  <text x="316" y="132" text-anchor="end" font-size="14" font-weight="bold" fill="#fde047">4</text>
</g>
<!-- Row 4: Currently studying -->
<g class="row" style="animation-delay:1.00s">
  <text x="24" y="162" font-size="14">🎓</text>
  <text x="48" y="162" font-size="13" fill="#c9d1d9">BTech CSE @ Silver Oak:</text>
  <text x="316" y="162" text-anchor="end" font-size="14" font-weight="bold" fill="#818cf8">2nd yr</text>
</g>
<!-- Row 5: Status -->
<g class="row" style="animation-delay:1.20s">
  <text x="24" y="192" font-size="14">💡</text>
  <text x="48" y="192" font-size="13" fill="#c9d1d9">Status:</text>
  <text x="316" y="192" text-anchor="end" font-size="14" font-weight="bold" fill="#4ade80">building</text>
  <circle cx="330" cy="188" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
</g>

<!-- Rank ring -->
<g transform="translate(412,136)">
  <circle r="52" fill="none" stroke="#1e2d40" stroke-width="9"/>
  <circle r="52" fill="none" stroke="url(#ringg)" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="254.8 326.7" stroke-dashoffset="254.8" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="254.8" to="80" dur="1.6s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </circle>
  <text class="rk" y="8" text-anchor="middle" font-size="22" font-weight="bold" fill="#22d3ee" filter="url(#g)">SP</text>
  <text y="26" text-anchor="middle" font-size="9" fill="#475569" opacity="0" style="animation:fadeIn .5s ease 1.8s forwards">DEV</text>
</g>

<g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="120" height="232" fill="url(#shg)"/></g>
</svg>

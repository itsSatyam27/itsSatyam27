<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="GitHub trophies for itsSatyam27">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popCell{0%{opacity:0;transform:translateY(16px) scale(.85)}70%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rankGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes shineX2{0%{transform:translateX(-200px) skewX(-15deg)}60%,100%{transform:translateX(1172px) skewX(-15deg)}}
.cell{opacity:0;animation:popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.rk{animation:rankGlow 2.2s ease-in-out infinite}
.sh2{animation:shineX2 5s ease-in-out 2s infinite}
]]></style>
<linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".06"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="tc"><rect x="0" y="0" width="1092" height="168" rx="14"/></clipPath>
</defs>

<!-- Trophy 1: Builder — most repos in JS -->
<g class="cell" style="animation-delay:0.30s">
  <rect x="12" y="12" width="158" height="144" rx="14" fill="#0B1220" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.3"/>
  <text x="91" y="50" text-anchor="middle" font-size="30">🏗️</text>
  <text class="rk" x="154" y="38" text-anchor="end" font-size="22" font-weight="bold" fill="#22d3ee" style="animation-delay:0.70s">SSS</text>
  <text x="91" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Builder</text>
  <text x="91" y="108" text-anchor="middle" font-size="11" fill="#64748b">12 public repos</text>
  <rect x="28" y="122" width="126" height="5" rx="2.5" fill="#1e2d40"/>
  <rect x="28" y="122" width="0" height="5" rx="2.5" fill="#22d3ee">
    <animate attributeName="width" from="0" to="126" dur="1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Trophy 2: Polyglot — 4 languages -->
<g class="cell" style="animation-delay:0.48s">
  <rect x="182" y="12" width="158" height="144" rx="14" fill="#0B1220" stroke="#fde047" stroke-opacity=".55" stroke-width="1.3"/>
  <text x="261" y="50" text-anchor="middle" font-size="30">🌐</text>
  <text class="rk" x="324" y="38" text-anchor="end" font-size="28" font-weight="bold" fill="#fde047" style="animation-delay:0.88s">A</text>
  <text x="261" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Polyglot Dev</text>
  <text x="261" y="108" text-anchor="middle" font-size="11" fill="#64748b">JS · Python · Dart · CSS</text>
  <rect x="198" y="122" width="126" height="5" rx="2.5" fill="#1e2d40"/>
  <rect x="198" y="122" width="0" height="5" rx="2.5" fill="#fde047">
    <animate attributeName="width" from="0" to="90" dur="1s" begin="0.78s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Trophy 3: Full-Stack -->
<g class="cell" style="animation-delay:0.66s">
  <rect x="352" y="12" width="158" height="144" rx="14" fill="#0B1220" stroke="#818cf8" stroke-opacity=".55" stroke-width="1.3"/>
  <text x="431" y="50" text-anchor="middle" font-size="30">⚡</text>
  <text class="rk" x="494" y="38" text-anchor="end" font-size="28" font-weight="bold" fill="#818cf8" style="animation-delay:1.06s">S</text>
  <text x="431" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Full-Stack</text>
  <text x="431" y="108" text-anchor="middle" font-size="11" fill="#64748b">React + Node.js</text>
  <rect x="368" y="122" width="126" height="5" rx="2.5" fill="#1e2d40"/>
  <rect x="368" y="122" width="0" height="5" rx="2.5" fill="#818cf8">
    <animate attributeName="width" from="0" to="110" dur="1s" begin="0.96s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Trophy 4: AI Builder -->
<g class="cell" style="animation-delay:0.84s">
  <rect x="522" y="12" width="158" height="144" rx="14" fill="#0B1220" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.3"/>
  <text x="601" y="50" text-anchor="middle" font-size="30">🤖</text>
  <text class="rk" x="664" y="38" text-anchor="end" font-size="28" font-weight="bold" fill="#4ade80" style="animation-delay:1.24s">A</text>
  <text x="601" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">AI Builder</text>
  <text x="601" y="108" text-anchor="middle" font-size="11" fill="#64748b">Lumi · Face Recog</text>
  <rect x="538" y="122" width="126" height="5" rx="2.5" fill="#1e2d40"/>
  <rect x="538" y="122" width="0" height="5" rx="2.5" fill="#4ade80">
    <animate attributeName="width" from="0" to="85" dur="1s" begin="1.14s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Trophy 5: CSE Student -->
<g class="cell" style="animation-delay:1.02s">
  <rect x="692" y="12" width="158" height="144" rx="14" fill="#0B1220" stroke="#f97316" stroke-opacity=".55" stroke-width="1.3"/>
  <text x="771" y="50" text-anchor="middle" font-size="30">🎓</text>
  <text class="rk" x="834" y="38" text-anchor="end" font-size="28" font-weight="bold" fill="#f97316" style="animation-delay:1.42s">S</text>
  <text x="771" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">CS Student</text>
  <text x="771" y="108" text-anchor="middle" font-size="11" fill="#64748b">BTech CSE · SOU</text>
  <rect x="708" y="122" width="126" height="5" rx="2.5" fill="#1e2d40"/>
  <rect x="708" y="122" width="0" height="5" rx="2.5" fill="#f97316">
    <animate attributeName="width" from="0" to="100" dur="1s" begin="1.32s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Trophy 6: UI/UX -->
<g class="cell" style="animation-delay:1.20s">
  <rect x="862" y="12" width="218" height="144" rx="14" fill="#0B1220" stroke="#67e8f9" stroke-opacity=".55" stroke-width="1.3"/>
  <text x="971" y="50" text-anchor="middle" font-size="30">🎨</text>
  <text class="rk" x="1064" y="38" text-anchor="end" font-size="28" font-weight="bold" fill="#67e8f9" style="animation-delay:1.60s">A</text>
  <text x="971" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">UI/UX Dev</text>
  <text x="971" y="108" text-anchor="middle" font-size="11" fill="#64748b">Creative Development</text>
  <rect x="878" y="122" width="186" height="5" rx="2.5" fill="#1e2d40"/>
  <rect x="878" y="122" width="0" height="5" rx="2.5" fill="#67e8f9">
    <animate attributeName="width" from="0" to="90" dur="1s" begin="1.50s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- shine sweep across all cells -->
<g clip-path="url(#tc)"><rect class="sh2" x="0" y="0" width="140" height="168" fill="url(#shg2)"/></g>
</svg>

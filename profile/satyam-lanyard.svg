<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="Satyam Pandey ID card lanyard">
<title>Satyam Pandey — swinging ID badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes settle{0%{transform:rotate(0deg) translateY(-660px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(13deg)}46%{transform:rotate(-9deg)}62%{transform:rotate(6deg)}78%{transform:rotate(-3.5deg)}92%{transform:rotate(1.5deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
@keyframes shine{0%{transform:translateX(-340px) skewX(-18deg)}55%,100%{transform:translateX(420px) skewX(-18deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settle{transform-origin:210px 6px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.2s ease-in-out 3.4s infinite}
.wob{transform-origin:210px 300px;animation:cardWobble 4.2s ease-in-out 3.4s infinite}
.shine{animation:shine 4.5s ease-in-out 3.6s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
.pl{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
]]></style>
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#1e3a5f"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#1e3a5f"/>
</linearGradient>
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#0f1a2e"/>
</linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#4f46e5;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#4f46e5;#22d3ee;#818cf8;#4f46e5" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#c8ccd6"/><stop offset="45%" stop-color="#8a90a0"/><stop offset="55%" stop-color="#6a7080"/><stop offset="100%" stop-color="#9aa0b0"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".13"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#22d3ee" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#818cf8;#22d3ee;#818cf8" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>
<radialGradient id="halo"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".14"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="cardclip"><rect x="82" y="298" width="256" height="330" rx="20"/></clipPath>
</defs>

<!-- ambient glow -->
<circle cx="210" cy="440" r="230" fill="url(#halo)"><animate attributeName="r" values="230;250;230" dur="5s" repeatCount="indefinite"/></circle>

<!-- sparkles -->
<g class="tw" style="animation-delay:.4s"><path d="M58 190l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#67e8f9"/></g>
<g class="tw" style="animation-delay:1.5s"><path d="M374 295l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#818cf8"/></g>
<g class="tw" style="animation-delay:2.6s"><path d="M50 478l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#22d3ee"/></g>
<!-- code bracket decoration -->
<g class="pl" style="animation-delay:.8s">
  <text x="355" y="488" font-size="22" fill="#4f46e5" opacity=".7">&lt;/&gt;</text>
</g>

<!-- pendulum: settle then sway -->
<g class="settle"><g class="sway">

  <!-- Strap -->
  <g>
    <path d="M191 -6 L229 -6 L226 236 L194 236 Z" fill="url(#strapg)"/>
    <line x1="196" y1="0" x2="198.5" y2="234" stroke="#fff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="224" y1="0" x2="221.5" y2="234" stroke="#fff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="0" y="0" font-size="10" font-weight="bold" fill="#fff" opacity=".85" letter-spacing="2" transform="translate(214,18) rotate(90)">SATYAM.DEV · BUILD · SHIP · REPEAT</text>
  </g>

  <!-- Clasp + ring -->
  <rect x="188" y="232" width="44" height="26" rx="6" fill="url(#metal)" stroke="#4a4f5c" stroke-width="1"/>
  <rect x="199" y="238" width="22" height="7" rx="3.5" fill="#3c414e"/>
  <circle cx="210" cy="272" r="14" fill="none" stroke="url(#metal)" stroke-width="5.5"/>

  <!-- Card (secondary wobble) -->
  <g class="wob">
    <rect x="82" y="298" width="256" height="330" rx="20" fill="url(#cardg)" stroke="url(#cardborder)" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- slot hole -->
    <rect x="180" y="310" width="60" height="10" rx="5" fill="#060c18" stroke="#1e3a5f" stroke-width="1"/>

    <g clip-path="url(#cardclip)">
      <!-- header band -->
      <rect x="82" y="298" width="256" height="34" fill="#0f1f3d" opacity=".8"/>
      <text x="98" y="345" font-size="9" fill="#64748b" letter-spacing="1.5">DEVELOPER ID</text>
      <text x="322" y="345" text-anchor="end" font-size="9" fill="#22d3ee" letter-spacing="1.5">SP-2027</text>

      <!-- avatar circle -->
      <circle cx="210" cy="412" r="59" fill="none" stroke="url(#cardborder)" stroke-width="2.5"/>
      <!-- Avatar: stylized "SP" monogram -->
      <circle cx="210" cy="412" r="55" fill="#0b1220"/>
      <text x="210" y="398" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#334155">FULL-STACK</text>
      <text x="210" y="432" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#f8fafc">SP</text>
      <text x="210" y="455" text-anchor="middle" font-size="9" fill="#64748b" letter-spacing="1">@itsSatyam27</text>

      <!-- name with animated gradient -->
      <text x="210" y="498" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="url(#nameg)" filter="url(#glow)">SATYAM PANDEY</text>
      <text x="210" y="518" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#67e8f9">FULL-STACK DEVELOPER</text>

      <!-- divider -->
      <line x1="102" y1="534" x2="318" y2="534" stroke="#1e3a5f" stroke-width="1"/>

      <!-- tags row -->
      <text x="108" y="552" font-size="10" fill="#4f46e5" font-weight="bold">[ React ]</text>
      <text x="172" y="552" font-size="10" fill="#22d3ee" font-weight="bold">[ Node.js ]</text>
      <text x="244" y="552" font-size="10" fill="#818cf8" font-weight="bold">[ Python ]</text>

      <!-- status bar -->
      <text x="102" y="574" font-size="9" fill="#475569">BUILD · DEBUG · LEARN · SHIP</text>
      <text x="318" y="574" text-anchor="end" font-size="9" fill="#22d3ee">01 / 01</text>

      <!-- status dot -->
      <circle cx="98" cy="595" r="4.5" fill="#4ade80"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="110" y="599" font-size="9" fill="#64748b">status: <tspan fill="#4ade80">building</tspan></text>

      <!-- shine sweep -->
      <rect class="shine" x="82" y="298" width="90" height="330" fill="url(#shineg)"/>
    </g>
  </g>
</g></g>
</svg>
